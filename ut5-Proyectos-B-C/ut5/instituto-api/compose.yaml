services:
  postgres:
    image: postgres:17-alpine
    container_name: instituto-postgres
    environment:
      POSTGRES_DB: instituto
      POSTGRES_USER: dwes
      POSTGRES_PASSWORD: dwes2026
    ports:
      - "5432:5432"
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwes -d instituto"]
      interval: 5s
      retries: 5

volumes:
  postgres-datos:
